name: CI

on:
  pull_request:
  push:
    branches: [master]

# A new push supersedes whatever was already running for the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Format, vet, lint, cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # go.mod's toolchain line names the exact Go every job builds with, the
      # same one `make check` runs locally (decision 2).
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - run: make fmt-check vet lint cross

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS is where the maintainer plays Arena, and its Metal backend is
        # the one path that needs cgo, so it is tested on real macOS rather
        # than cross-compiled (decision 3). Windows is compile-checked by
        # `make cross` until the MVP ships.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test, under the race detector
        run: make race

      - name: Build and check the release binary's size
        run: make size

      - name: The binary starts without a display
        run: ./bin/mtga-draft-assistant -version

      # Linux measures this in the smoke job, under Xvfb. macOS runners have
      # a logged-in session, so the real Metal window can open here. Three
      # runs: the first pays the cold shader cache a fresh runner always has,
      # the others show a relaunch. Reported, not gated (decision 19).
      - name: Time to first frame
        if: runner.os == 'macOS'
        shell: bash
        run: |
          {
            echo '### Time to first frame (macOS)'
            echo
            echo '```'
            scripts/first-frame.sh bin/mtga-draft-assistant 3
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # Launches the real window under Xvfb with Mesa's software EGL, keeps the
  # first-paint screenshot for the reviewer, and fails if the app burns CPU
  # while nothing is happening (decision 10): once still looking for Arena's
  # log, and once following a fixture log.
  smoke:
    name: Launch, screenshot, idle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install a headless display and software EGL
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libegl1 libegl-mesa0 libgl1-mesa-dri imagemagick dbus

      # An explicit `shell: bash` runs the step with pipefail; without it the
      # `tee` below would report success for a smoke test that failed.
      #
      # dbus-run-session gives the app a session bus, as every Linux desktop
      # does. Without one, godbus autolaunches a bus for go-gui's
      # accessibility bridge, a path no user's machine takes. Measured
      # outside CI that autolaunch costs ~0.1 s, not the multi-second stall
      # once seen on runners (#2); the startup line below now says which
      # stage any such stall lands in.
      - name: Launch the app
        shell: bash
        run: |
          {
            echo '### First paint and time to first frame (Linux, Xvfb)'
            echo
            echo '```'
            dbus-run-session -- xvfb-run -a -s "-screen 0 420x760x24" make smoke
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: first-paint
          path: |
            bin/first-paint.png
            bin/following.png
          if-no-files-found: ignore

  # Its own job, outside `make check`, because it needs the network and a new
  # advisory can land against an unchanged go.sum on any PR; that should read
  # as exactly that, not as the PR's own failure.
  vuln:
    name: Known vulnerabilities (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - run: make vuln
